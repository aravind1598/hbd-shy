<!--
  SARVIKA BIRTHDAY SITE — BUG FIX PATCH
  =======================================
  ஒரே 2 மாற்றம் உங்க original file-ல செய்யுங்க. கீழ 2 பகுதி இருக்கு:

  PART A — இதை உங்க file-ல <head> பகுதில,
  <link href="https://fonts.googleapis.com/..."> line-க்கு
  அடுத்தபடியா paste பண்ணுங்க:
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<!--
  ஏன் இது வேணும்: உங்க file-ல bow/heart/tree animation script
  (__initBowTreeFilm) "gsap.registerPlugin(...)" -னு முதல் lineலேயே
  gsap-ஐ use பண்ணுது, ஆனா gsap library எங்கயுமே load ஆகல.
  அதனால அந்த script உடனே error போட்டு நிக்கும் — இதனால தான்
  gate tap ஆகல, tree grow ஆகல, heart burst ஆகல, எல்லாமே stop.
  இந்த ஒரு line போட்டதும் பாதி bugs தானா சரியாகிடும்.


  PART B — கீழ இருக்குற முழு <script> block-ஐ,
  உங்க file-ல கடைசி </body> tag-க்கு சரியா முன்னாடி
  paste பண்ணுங்க (உங்க இருக்குற எல்லா <script> tags-க்கும் அப்புறம்):
-->

<script>
(function () {
  'use strict';

  /* ============================================================
     FIX 2 — "tap to unwrap" gate-க்கு click/keyboard handler
     இல்லாம இருந்துச்சு, அதனால tap பண்ணா ஒண்ணும் நடக்கல.
     ============================================================ */
  function wireGate() {
    var gate = document.getElementById('gate');
    if (!gate || gate.dataset.wired) return;
    gate.dataset.wired = '1';
    function openGate() {
      if (gate.classList.contains('is-open')) return;
      gate.classList.add('is-open');
      gate.setAttribute('aria-hidden', 'true');
    }
    gate.addEventListener('click', openGate);
    gate.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGate(); }
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wireGate);
  } else {
    wireGate();
  }

  /* ============================================================
     FIX 3 — Intro film ("3,2,1 → You Are So Special") full-ஆ
     காட்டறதுக்கு முன்னாடியே (9 வினாடில) force-ஆ next scene-க்கு
     cut பண்ணிடுச்சு. "Special" word வர ~15 வினாடி ஆகும்,
     அதனால timeout-ஐ 16 வினாடிக்கு உயர்த்துறோம்.
     ============================================================ */
  window.enterApp = function () {
    var wl = document.getElementById('welcome');
    if (wl) wl.classList.add('out');
    setTimeout(function () {
      if (wl) wl.style.display = 'none';
      if (typeof window.__playIntroFilm === 'function') {
        window.__playIntroFilm();
        var overlay = document.getElementById('fallbackOverlay');
        if (overlay) { setTimeout(function () { overlay.click(); }, 30); }
        setTimeout(function () {
          var app = document.getElementById('app');
          var stage = document.getElementById('bowStage');
          if (app && app.style.opacity !== '1' && stage && stage.style.display !== 'block') {
            window.__introFilmDone();
          }
        }, 16000); // was 9000 — cut "Special" off mid-word before; now the full sequence plays
      } else if (typeof window.startBowTreeFilm === 'function') {
        window.startBowTreeFilm();
      }
    }, 680);
  };

  /* ============================================================
     FIX 4 — Music Player page-ல songs "play" ஆனா sound ஒண்ணும்
     வராது (fake progress bar மட்டும் இருந்துச்சு, real audio
     இல்ல). இப்போ Web Audio synth வெச்சு ஒவ்வொரு track-க்கும்
     ஒரு சின்ன tune play பண்ணும் (audio file தேவையில்ல).
     ============================================================ */
  var TRACK_NOTES = [
    [[261, .4], [261, .4], [294, .8], [261, .8], [349, .8], [330, 1.6]],
    [[392, .3], [440, .3], [494, .3], [440, .3], [392, .6], [349, .6]],
    [[330, .4], [349, .4], [392, .4], [440, .8], [392, .8]],
    [[523, .3], [494, .3], [440, .3], [392, .6], [440, .6]],
    [[294, .25], [330, .25], [349, .25], [392, .25], [440, .5], [392, .5]],
    [[349, .3], [392, .3], [440, .3], [494, .3], [440, .6], [349, .6]],
    [[440, .3], [392, .3], [349, .3], [330, .3], [294, .6], [261, .6]],
    [[261, .3], [293, .3], [329, .3], [349, .3], [392, .6], [440, .6]]
  ];
  var tMTimer = null;

  function playTrackLoop() {
    if (typeof tPlaying === 'undefined' || !tPlaying) return;
    if (typeof aCtx === 'undefined') return; // original script's shared var
    if (!window.aCtx && typeof aCtx !== 'undefined') { /* no-op, aCtx is shared lexical var */ }
    try {
      if (!aCtx) aCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (aCtx.state === 'suspended') aCtx.resume();
    } catch (e) { return; }
    clearTimeout(tMTimer);
    var t = aCtx.currentTime;
    var idx = (typeof curTrack === 'number') ? curTrack : 0;
    var notes = TRACK_NOTES[idx % TRACK_NOTES.length];
    notes.forEach(function (n) {
      if (typeof playNote === 'function') playNote(n[0], n[1], t);
      t += n[1];
    });
    var total = notes.reduce(function (s, n) { return s + n[1]; }, 0);
    tMTimer = setTimeout(playTrackLoop, total * 1000);
  }

  var _origStartTA = (typeof startTA === 'function') ? startTA : null;
  window.startTA = function () {
    if (_origStartTA) _origStartTA();
    try { tPlaying = true; } catch (e) {}
    playTrackLoop();
  };

  var _origStopTA = (typeof stopTA === 'function') ? stopTA : null;
  window.stopTA = function () {
    if (_origStopTA) _origStopTA();
    try { tPlaying = false; } catch (e) {}
    clearTimeout(tMTimer);
  };

})();
</script>
